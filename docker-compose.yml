# 自动配液产线 Petri 网审计台
# 用法：
#   仅启动 Web：        docker compose up web            （默认宿主机端口 8080）
#   指定宿主机端口：     HOST_PORT=9090 docker compose up web
#   运行一次性验收：     docker compose up --exit-code-from verify --abort-on-container-exit
#                        （verify 在真实浏览器中执行场景，退出码即验收结果）
name: petri-audit

services:
  web:
    build: .
    image: petri-audit-web:latest
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性验收服务：等待 web 健康后，在真实 Chromium 中执行端到端场景，
  # 全部通过则以退出码 0 退出，否则以非零退出码报告失败。
  verify:
    build: ./verify
    image: petri-audit-verify:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:80
      HEALTH_PATH: /health
      WAIT_TIMEOUT_MS: "90000"
    restart: "no"
