server {
    listen 80;
    server_name _;

    # Web 健康检查端点（供 Docker HEALTHCHECK / Compose healthcheck 使用）
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
